<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentroy Monitor</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="drag" data-tauri-drag-region></div>

    <!-- First run: what is (and is not) collected -->
    <section id="consent" class="screen intro" hidden>
      <img class="logo" src="logo.png" alt="" />
      <h1 data-t="consentTitle"></h1>
      <p data-t="consentCollected"></p>
      <ul class="list">
        <li data-t="consentTime"></li>
        <li data-t="consentActivity"></li>
        <li data-t="consentApps"></li>
        <li data-t="consentScreens"></li>
      </ul>
      <p class="muted small" data-t="consentNever"></p>
      <button id="accept" class="primary wide" data-t="consentAccept"></button>
      <p class="version-line muted"></p>
    </section>

    <!-- Device sign-in -->
    <section id="signin" class="screen intro" hidden>
      <img class="logo" src="logo.png" alt="" />
      <h1 data-t="signinTitle"></h1>
      <div id="signin-idle" class="stack">
        <p class="muted" data-t="signinIntro"></p>
        <button id="login" class="primary wide" data-t="signinButton"></button>
        <details class="server">
          <summary data-t="server"></summary>
          <form id="server-form">
            <input id="server" type="url" spellcheck="false" autocomplete="off" />
          </form>
        </details>
      </div>
      <div id="signin-pending" class="stack" hidden>
        <p class="muted" data-t="signinCode"></p>
        <p id="user-code" class="code"></p>
        <p class="muted waiting"><span class="spinner"></span><span data-t="signinWaiting"></span></p>
        <div class="row">
          <button id="open-again" data-t="openAgain"></button>
          <button id="cancel-login" class="ghost" data-t="cancel"></button>
        </div>
      </div>
      <p class="version-line muted"></p>
    </section>

    <!-- Tracker -->
    <section id="main" class="screen tracker" hidden>
      <header class="top">
        <img class="tile" src="logo.png" alt="" />
        <div class="who">
          <strong id="company"></strong>
          <span id="user" class="muted"></span>
        </div>
        <details class="menu">
          <summary aria-label="Menu">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6" /><circle cx="10" cy="10" r="1.6" /><circle cx="15.5" cy="10" r="1.6" /></svg>
          </summary>
          <div class="menu-items">
            <button id="dashboard" data-t="dashboard"></button>
            <button id="refresh" data-t="refresh"></button>
            <button id="permissions" data-t="permissions"></button>
            <hr />
            <button id="signout" class="danger" data-t="signOut"></button>
          </div>
        </details>
      </header>

      <div id="update" class="banner" hidden>
        <span id="update-text"></span>
        <button id="update-install" class="primary small-btn" data-t="installRestart"></button>
      </div>

      <div class="pickers">
        <label class="field">
          <span data-t="project"></span>
          <select id="project"></select>
        </label>
        <label class="field">
          <span data-t="task"></span>
          <select id="task"></select>
        </label>
      </div>
      <form id="new-task" class="new-task">
        <input id="new-task-title" maxlength="200" autocomplete="off" />
        <button class="icon-btn" aria-label="Add" data-t-title="add">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
        </button>
      </form>

      <div class="timer">
        <button id="toggle" class="play" aria-pressed="false"><span class="glyph"></span></button>
        <div class="timer-main">
          <div id="clock" class="clock">00:00:00</div>
          <div id="current" class="current"></div>
        </div>
        <div class="timer-stats">
          <div class="stat"><span data-t="today"></span><b id="today">0:00</b></div>
          <div class="stat"><span data-t="activity"></span><b id="activity">—</b></div>
        </div>
        <div class="meter"><div id="meter-bar"></div></div>
        <div id="shots" class="shots" hidden>
          <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h2l1.2-1.8h4.6L13.5 6h2A1.5 1.5 0 0 1 17 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z" /><circle cx="10" cy="11" r="2.8" /></svg>
          <span id="shots-text"></span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span data-t="lastHour"></span>
        </div>
        <div id="bars" class="bars"></div>
      </div>

      <div class="panel grow">
        <div class="panel-head">
          <span data-t="today"></span>
          <b id="today-total"></b>
        </div>
        <ul id="today-list" class="today-list"></ul>
        <p id="today-empty" class="muted empty" data-t="todayEmpty"></p>
      </div>

      <footer class="status">
        <i id="dot" class="dot"></i>
        <span id="online"></span>
        <span id="sep" class="sep">·</span>
        <span id="sync" class="muted"></span>
        <span id="version" class="muted push"></span>
      </footer>
    </section>

    <!-- Permissions sheet -->
    <div id="perm" class="sheet-backdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="perm-title">
        <h2 id="perm-title" data-t="permTitle"></h2>
        <p class="muted small" data-t="permIntro"></p>
        <ul id="perm-list" class="perm-list"></ul>
        <p id="perm-restart" class="hint small" hidden>
          <span data-t="restartHint"></span>
          <button id="perm-restart-btn" class="link" data-t="restartApp"></button>
        </p>
        <div class="row end">
          <button id="perm-signout" class="ghost" data-t="signOut"></button>
          <button id="perm-continue" class="primary" data-t="permContinue"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden>
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h2l1.2-1.8h4.6L13.5 6h2A1.5 1.5 0 0 1 17 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z" /><circle cx="10" cy="11" r="2.8" /></svg>
      <span id="toast-text"></span>
    </div>

    <div id="notice" class="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="notice-close" aria-label="Close">×</button>
    </div>
  </body>
</html>
