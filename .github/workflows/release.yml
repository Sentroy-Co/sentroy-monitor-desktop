# Windows + Linux release builds. On a `v*` tag push this builds the agent,
# signs the updater artifacts and uploads everything (plus latest.json with the
# windows/linux platforms merged into any existing one) to the GitHub release
# of that tag. macOS is built, signed and notarized locally with build-mac.sh;
# see README "Release".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One at a time: both jobs read-modify-write latest.json on the release.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libx11-dev libxss-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libegl-dev libwayland-dev \
            libclang-dev clang pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build and upload
        # tauri-action v0.6.2
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sentroy Monitor ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
