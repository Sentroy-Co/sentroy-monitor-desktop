[package]
name = "sentroy-monitor"
version = "0.2.0"
description = "Sentroy Monitor desktop agent: time tracking against tasks with privacy-first activity measurement."
authors = ["Sentroy"]
license = "FSL-1.1-ALv2"
edition = "2021"
publish = false

[lib]
name = "sentroy_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring / KWallet) with the kernel keyutils as cache.
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
# Pure-Rust X11 client: idle time (MIT-SCREEN-SAVER) and the active window's PID.
x11rb = { version = "0.13", features = ["screensaver"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
